name: Publish to npm
# A v* tag is the release trigger. npm trusted publishing (OIDC) authenticates; there is no npm token secret.
on:
  push:
    tags:
      - "v*"
jobs:
  publish:
    runs-on: macos-latest
    # The npm environment only accepts v* tags. npm's trusted publisher must name this environment exactly.
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          # No registry-url: it writes an .npmrc with an empty token that overrides OIDC.
      - run: npm ci
      - name: Tag matches package.json version
        run: test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      - run: npm run verify
      - run: npm publish --access public
