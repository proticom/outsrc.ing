name: CI
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '${{ matrix.node }}'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run verify
  # The one required status check. It runs on every push and pull request, so it never waits on a skipped job.
  ci-gate:
    name: ci-gate
    runs-on: ubuntu-latest
    needs: [verify]
    if: always()
    steps:
      - name: Require every CI job to succeed
        run: |
          echo "verify: ${{ needs.verify.result }}"
          test "${{ needs.verify.result }}" = "success"
